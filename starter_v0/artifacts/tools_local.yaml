# Khai báo tool cho MODEL LOCAL NHỎ (Step 7 bonus) — bản riêng, không dùng cho model cloud.
# Gốc: artifacts/tools.yaml (v3). v4-local: đưa quy tắc từ khóa routing lên ĐẦU mô tả
# `lookup` và `social_search` (model 2B hay chọn social_search cho câu hỏi tin tức).
tools:
  # ---------------- Core tools ----------------
  - name: clarify
    description: >-
      Gửi một câu hỏi cho người dùng và tạm dừng chờ lượt trả lời tiếp theo.
      Dùng khi thiếu thông tin bắt buộc (thiếu tên tài khoản/handle, thiếu URL, thiếu tên GitHub repo),
      HOẶC khi cần xin xác nhận trước khi thực hiện hành động ghi ra ngoài (gửi/đăng tin bằng `send`).
      Không dùng cho câu hỏi ngoài phạm vi hoặc khi đã có đủ tham số cần thiết.
    parameters:
      type: object
      properties:
        question: {type: string, default: "", description: "Câu hỏi rõ ràng gửi cho người dùng."}
        response_type:
          type: string
          enum: [text, yes_no, choice]
          default: "text"
          description: >-
            Đặt 'yes_no' bất cứ khi nào cần xin xác nhận trước khi thực hiện hành động (như gửi/đăng
            lên Telegram, kể cả khi user mới nói 'đăng bản tin này' mà chưa đưa nội dung — vẫn phải
            hỏi xác nhận 'yes_no' trước). Đặt 'text' khi hỏi bổ sung thông tin còn thiếu (tài khoản,
            URL, repo). Đặt 'choice' khi đưa danh sách lựa chọn (`options`).
        options: {type: array, default: [], items: {type: string}, description: "Các lựa chọn khi response_type là 'choice'."}
      required: [question]

  - name: timeline
    description: >-
      Lấy các bài đăng X/Twitter gần đây của MỘT tài khoản cụ thể.
      Dùng khi người dùng hỏi tweet/bài đăng CỦA một người hoặc tài khoản cụ thể (map tên người
      nổi tiếng sang handle nếu user nêu tên, vd Sam Altman -> 'sama', Elon Musk -> 'elonmusk',
      Andrej Karpathy -> 'karpathy').
      Không dùng để tìm tweet theo từ khóa/chủ đề (dùng `social_search`), tin web (dùng `lookup`),
      hoặc khi user không nói rõ tweet của ai (gọi `clarify` trước).
    parameters:
      type: object
      properties:
        screenname: {type: string, default: "", description: "Handle tài khoản X/Twitter KHÔNG có ký tự '@' (vd 'sama', 'elonmusk', 'karpathy')."}
        limit: {type: integer, default: 5, description: "Số lượng bài đăng cần lấy (giữ đúng số user yêu cầu nếu có)."}
      required: [screenname]

  - name: social_search
    description: >-
      CHỈ dùng khi câu của user có chữ "Twitter", "X" hoặc "tweet". Nếu câu hỏi về "tin", "tin tức",
      "thời sự", "web" mà KHÔNG nhắc Twitter/X/tweet thì KHÔNG dùng tool này — dùng `lookup`.
      Nếu user nói "bỏ Twitter" / "chuyển sang web" thì cũng dùng `lookup`.
      Tìm các bài đăng trên X/Twitter theo từ khóa hoặc chủ đề.
      Không dùng cho tweet của một tài khoản cụ thể (dùng `timeline`), và KHÔNG gọi với `query` rỗng
      (nếu thiếu cả người lẫn chủ đề thì phải gọi `clarify` trước).
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa hoặc chủ đề tìm kiếm ngắn gọn, BẮT BUỘC khác rỗng (vd 'GPT-5', 'OpenAI', 'AI')."}
        search_type:
          type: string
          enum: [Latest, Top]
          default: "Latest"
          description: "Đặt 'Top' khi user hỏi tweet phổ biến/nổi bật (top/popular); đặt 'Latest' cho tweet mới nhất."
        limit: {type: integer, default: 5, description: "Số lượng tweet cần trả về."}
      required: [query]

  - name: lookup
    description: >-
      TOOL MẶC ĐỊNH cho mọi câu hỏi "tin", "tin tức", "thời sự", "có gì mới", "tìm trên web"
      (vd "Tin blockchain hôm nay", "Xe điện tuần này có gì mới?") → topic='news'.
      Tra cứu thông tin web hoặc tin tức thời sự qua Tavily (kể cả khi user chuyển từ Twitter sang web).
      Không dùng khi đã có URL cụ thể (dùng `fetch`), hỏi tweet trên X/Twitter (dùng `timeline` hoặc
      `social_search`), hỏi GitHub repo cụ thể (dùng `github_repo`), tìm paper arXiv (dùng `papers`),
      hoặc hỏi quy định nội bộ công ty (dùng `policy`).
    parameters:
      type: object
      properties:
        query:
          type: string
          default: ""
          description: >-
            CHỈ truyền từ khóa chủ đề cốt lõi (vd 'AI', 'robotics', 'OpenAI').
            KHÔNG thêm chữ 'news', 'tin tức', hay từ chỉ thời gian như 'today'/'hôm nay' vào `query`,
            vì đã có `topic` và `timeframe` đảm nhận.
        topic:
          type: string
          enum: [general, news]
          default: "general"
          description: "Đặt 'news' khi tìm tin tức, thời sự, tin nổi bật; đặt 'general' cho tra cứu thông tin chung."
        timeframe:
          type: string
          enum: [day, week, month, year]
          default: "week"
          description: "Khoảng thời gian: 'day' cho hôm nay/24h qua, 'week' cho tuần này, 'month' hoặc 'year'."
        max_results: {type: integer, default: 5, description: "Số kết quả tối đa."}
      required: [query]

  - name: fetch
    description: >-
      Đọc và trích xuất nội dung markdown từ MỘT địa chỉ URL cụ thể qua Firecrawl.
      Chỉ dùng khi người dùng đã cung cấp URL hợp lệ (`http://` hoặc `https://`).
      Không dùng khi user chỉ nói mơ hồ như 'bài viết này' mà thiếu link (gọi `clarify` trước),
      không dùng để tìm kiếm web (dùng `lookup`), hoặc đọc PDF arXiv (dùng `paper_text`).
    parameters:
      type: object
      properties:
        url: {type: string, default: "", description: "Địa chỉ URL đầy đủ (`http://` hoặc `https://`) do user cung cấp hoặc lấy từ kết quả tìm kiếm."}
      required: [url]

  - name: format
    description: >-
      Trình bày danh sách item đã thu thập được thành văn bản markdown theo khuôn mẫu.
      Dùng sau khi đã lấy dữ liệu từ các tool đọc khi user muốn tổng hợp hoặc định dạng thành bản tin.
      Không có chức năng tìm kiếm hay tải dữ liệu mới từ internet.
    parameters:
      type: object
      properties:
        items:
          type: array
          default: []
          description: "Danh sách item đã thu thập."
          items:
            type: object
            properties:
              title: {type: string}
              url: {type: string}
              source: {type: string}
              summary: {type: string}
              section: {type: string}
        template: {type: string, enum: [brief, sections, bullets, thread, daily_ai_vn], default: "sections", description: "Khuôn định dạng đầu ra."}
        headline: {type: string, default: "", description: "Tiêu đề bản tin."}
      required: [items, template]

  # ---------------- Bonus / Extended tools ----------------
  - name: send
    description: >-
      Gửi một đoạn văn bản lên kênh Telegram của nhóm (hành động có tác dụng phụ ra ngoài).
      RANH GIỚI XÁC NHẬN: CHỈ gọi tool này SAU KHI người dùng đã xác nhận rõ ràng việc gửi trong
      cuộc hội thoại hiện tại và đặt `confirmed=true`.
      Nếu chưa có xác nhận rõ ràng, KHÔNG gọi `send` — phải gọi `clarify(response_type="yes_no")` trước.
      TUYỆT ĐỐI KHÔNG dùng `send` để trả lời các câu hỏi chat thường hoặc câu hỏi ngoài phạm vi.
    parameters:
      type: object
      properties:
        text: {type: string, default: "", description: "Nội dung văn bản đã được người dùng duyệt để gửi."}
        confirmed: {type: boolean, default: false, description: "Chỉ đặt `true` sau khi người dùng xác nhận rõ; nếu chưa xác nhận thì không gọi `send`."}
      required: [text]

  - name: policy
    description: >-
      Tìm kiếm trong tài liệu chính sách nội bộ của công ty (`company_policy/*.md`).
      Dùng khi hỏi về quy định quy trình research AI, tiêu chuẩn trích dẫn nguồn, bảo mật dữ liệu,
      duyệt đăng tin công khai, hoặc giới hạn sử dụng tool.
      Không dùng cho tin tức web bên ngoài (`lookup`) hay paper khoa học (`papers`).
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Truy vấn tìm trong policy nội bộ."}
        policy_area: {type: string, enum: [all, ai_research, source_citation, data_privacy, external_publishing, tool_usage], default: "all", description: "Nhóm chính sách cần lọc."}
        top_k: {type: integer, default: 3, description: "Số mục kết quả phù hợp nhất cần trả về."}
      required: [query]

  - name: papers
    description: >-
      Tìm kiếm bài báo khoa học và preprint trên arXiv.
      Dùng khi người dùng hỏi tìm paper, nghiên cứu học thuật, preprint theo chủ đề hoặc tác giả.
      Không dùng cho tin tức web chung (`lookup`) hoặc trích text PDF của một arXiv ID cụ thể (`paper_text`).
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa học thuật cần tìm."}
        max_results: {type: integer, default: 5, description: "Số lượng paper cần lấy (1–10)."}
        sort_by: {type: string, enum: [relevance, lastUpdatedDate, submittedDate], default: "relevance", description: "Thứ tự sắp xếp kết quả."}
      required: [query]

  - name: paper_text
    description: >-
      Tải file PDF arXiv và trích xuất nội dung văn bản cục bộ.
      Chỉ dùng khi người dùng cung cấp sẵn một arXiv ID (vd '1706.03762') hoặc URL arXiv cụ thể
      và muốn đọc nội dung chi tiết của bài báo đó.
      Không dùng để tìm paper theo chủ đề (`papers`) hoặc đọc trang web thường (`fetch`).
    parameters:
      type: object
      properties:
        arxiv_url: {type: string, default: "", description: "arXiv ID (vd '1706.03762') hoặc URL bài báo arXiv."}
        max_pages: {type: integer, default: 5, description: "Số trang PDF tối đa cần trích xuất."}
        max_chars: {type: integer, default: 8000, description: "Số ký tự tối đa trả về."}
      required: [arxiv_url]

  - name: github_repo
    description: >-
      Lấy thông tin chi tiết của một GitHub repository cụ thể (stars, forks, ngôn ngữ,
      license, lần push gần nhất, và các release mới nhất).
      Dùng khi người dùng hỏi về một repo GitHub cụ thể.
      Không dùng cho tin tức (dùng `lookup`), tweet (dùng `social_search`), đọc nội dung trang web
      (dùng `fetch`), hoặc paper khoa học (dùng `papers`). Nếu chưa rõ repo nào thì gọi `clarify` trước.
    parameters:
      type: object
      properties:
        repo:
          type: string
          default: ""
          description: "Định dạng bắt buộc 'owner/name' (vd 'openai/whisper'); không URL, không '@', không '.git'."
        max_releases:
          type: integer
          default: 3
          description: "Số release mới nhất cần lấy (giới hạn 0–10; 0 = không lấy release)."
      required: [repo]
